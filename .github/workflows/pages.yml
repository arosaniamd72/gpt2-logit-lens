# Publishes docs/ to GitHub Pages.
# One-time setup: Settings > Pages > Source: "GitHub Actions". The Actions
# token can't create the Pages site itself (that needs admin rights), so
# that switch has to be flipped by hand once; after that every change to
# docs/ deploys automatically.
name: Deploy viewer to GitHub Pages

on:
  push:
    branches: [main]
    paths: ["docs/**"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
